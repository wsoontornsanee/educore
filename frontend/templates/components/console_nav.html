{% load i18n %}
<style>
  .console-nav {
    width: 248px;
    flex: none;
    background: #fff;
    border-right: 1px solid #E5DDD9;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .console-nav-scrim { display: none; }
  .console-nav-open-btn { display: none; }

  @media (max-width: 719px) {
    /* base.html's own header (logo/user name/language/logout) is shared by
       every page, including marketing/login pages that never render this
       component -- so this rule lives here, scoped to console pages only,
       rather than in base.html itself. base.html's <header> sets padding
       inline (higher specificity than a plain external rule), and on a
       narrow viewport its two flex children wrap onto separate lines --
       both need to clear the fixed hamburger button below, so !important
       overrides the inline padding-left on the header itself rather than
       chasing each child individually. */
    body > header {
      padding-left: 60px !important;
    }
    .console-nav {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      width: 276px;
      max-width: 84vw;
      transform: translateX(-100%);
      transition: transform .2s ease;
    }
    .console-nav.is-open {
      transform: translateX(0);
    }
    .console-nav-scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(22, 17, 15, .45);
      z-index: 30;
    }
    .console-nav-scrim.is-open {
      display: block;
    }
    .console-nav-open-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid #E5DDD9;
      background: #fff;
      cursor: pointer;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 50;
    }
  }
</style>

<button type="button" id="console-nav-open" class="console-nav-open-btn" aria-label="{% translate 'Buka navigasi' %}" aria-expanded="false" aria-controls="console-nav">
  <svg viewBox="0 0 24 24" fill="none" stroke="#16110F" stroke-width="1.6" stroke-linecap="round" style="width:18px;height:18px;display:block">
    <path d="M4 7h16M4 12h16M4 17h16"></path>
  </svg>
</button>
<div id="console-nav-scrim" class="console-nav-scrim"></div>

<aside class="console-nav" id="console-nav">
  <a href="{% url 'web-console-home' %}" style="padding:18px 16px;border-bottom:1px solid #E5DDD9;display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit">
    <div style="width:22px;height:22px;background:#C8102E;flex:none"></div>
    <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em">EduCore</span>
  </a>
  <nav style="padding:12px 10px 20px;display:flex;flex-direction:column;gap:18px;flex:1">
    {% for group in nav_groups %}
    <div style="display:flex;flex-direction:column;gap:3px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#A4998F;padding:4px 10px 6px">{{ group.label }}</span>
      {% for item in group.items %}
      <a href="{% url item.url_name %}" style="display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:6px;color:#5A4F49;text-decoration:none;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500">{{ item.label }}</a>
      {% endfor %}
    </div>
    {% endfor %}
  </nav>
  <div style="border-top:1px solid #E5DDD9;padding:14px 16px;display:flex;align-items:center;gap:11px">
    <span style="width:34px;height:34px;background:#FDE7EA;color:#C8102E;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none">{{ request.user.full_name|slice:":2"|upper }}</span>
    <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
      <span style="font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ request.user.full_name }}</span>
    </span>
  </div>
</aside>

<script>
  (function () {
    var openBtn = document.getElementById('console-nav-open');
    var nav = document.getElementById('console-nav');
    var scrim = document.getElementById('console-nav-scrim');
    if (!openBtn || !nav || !scrim) return;

    function openNav() {
      nav.classList.add('is-open');
      scrim.classList.add('is-open');
      openBtn.setAttribute('aria-expanded', 'true');
    }
    function closeNav() {
      nav.classList.remove('is-open');
      scrim.classList.remove('is-open');
      openBtn.setAttribute('aria-expanded', 'false');
    }
    openBtn.addEventListener('click', openNav);
    scrim.addEventListener('click', closeNav);
    nav.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', closeNav);
    });
  })();
</script>
